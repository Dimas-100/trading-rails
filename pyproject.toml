[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-rails"
version = "0.1.0"
description = "Broker-agnostic trading toolkit with safety rails: dry-run by default, arming flag, typed CONFIRM."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
webull = ["webull-openapi-python-sdk==2.0.10", "python-dotenv>=1.0"]

[project.scripts]
rails = "trading_rails.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
